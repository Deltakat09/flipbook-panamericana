<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Flipbook</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/jquery.min.js"></script>
  <script src="js/turn.min.js"></script>
  <style>
    body {
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 50px;
      font-family: sans-serif;
    }

    #flipbook {
      width: 800px;
      height: 500px;
    }

    #flipbook .page {
      width: 400px;
      height: 500px;
    }

    #flipbook .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="flipbook">
    <div class="page"><img src="pages/page1.jpg" alt="Página 1"></div>
    <div class="page"><img src="pages/page2.jpg" alt="Página 2"></div>
    <div class="page"><img src="pages/page3.jpg" alt="Página 3"></div>
    <div class="page"><img src="pages/page4.jpg" alt="Página 4"></div>
    <!-- Agrega más páginas según necesites -->
  </div>

  <script>
    $("#flipbook").turn({
      width: 800,
      height: 500,
      autoCenter: true
    });
  </script>

</body>
</html>
